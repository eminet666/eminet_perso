name: Envoyer email Hello World

on:
  workflow_dispatch:  # Déclenchement manuel

jobs:
  send_email:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # sécurité pour éviter blocage

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Installer dépendances
        run: pip install smtplib email-validator

      - name: Envoyer e-mail Hello World
        run: python send_hello_email.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}        # ton identifiant SMTP
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }} # ton mot de passe SMTP
          EMAIL_TO: ${{ secrets.EMAIL_TO }}           # destinataire
